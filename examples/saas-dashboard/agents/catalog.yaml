version: 1
absent:
  - identity: ui
    covers: [pages, layouts, and visual components]
    triggers: [ui, component, components, page, pages, layout]
  - identity: api
    covers: [request and response contracts]
    triggers: [api, endpoint, request, response]
  - identity: observe
    covers: [system health and telemetry]
    triggers: [log, metric, alert, monitoring]
  - identity: security
    covers: [adversarial threats and vulnerabilities]
    triggers: [security, threat, vulnerability]
