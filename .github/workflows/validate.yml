name: Validate Pillars

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r tooling/ci/requirements.txt
      - name: Run validator unit tests
        run: python3 -m unittest discover -s tooling/ci/tests -v
      - name: Validate structure and routing conformance
        run: >-
          python3 tooling/ci/validate_pillars.py
          . --recursive-scopes
          --standalone examples
          --fixtures tooling/conformance/fixtures.yaml
      - name: Check release consistency
        run: python3 tooling/ci/check_consistency.py
