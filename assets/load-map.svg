<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Pillars load map</title>
  <desc id="d">Quest map of five stages: write, declare, match, load, act. The final stage is the task with context.</desc>
  <style>
    .sans{font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
  </style>
  <rect width="1200" height="320" fill="#0E1218"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="10" fill="none" stroke="#2A3548"/>
  <text x="600" y="48" class="mono" font-size="14" font-weight="700" fill="#E8B84A" text-anchor="middle" letter-spacing="3">THE LOAD MAP</text>
  <text x="600" y="74" class="sans" font-size="16" fill="#A8B0C0" text-anchor="middle">Five stages from blank agent to briefed work.</text>

  <g font-family="ui-monospace,Menlo,monospace" font-weight="700" font-size="13" fill="#0E1218" text-anchor="middle">
    <rect x="40" y="120" width="180" height="72" rx="6" fill="#3DDC97"/>
    <text x="130" y="152">1 WRITE</text>
    <text x="130" y="174" fill="#10261E" font-weight="600">plain briefings</text>

    <rect x="260" y="120" width="180" height="72" rx="6" fill="#3DDC97"/>
    <text x="350" y="152">2 DECLARE</text>
    <text x="350" y="174" fill="#10261E" font-weight="600">covers + triggers</text>

    <rect x="480" y="120" width="180" height="72" rx="6" fill="#3DDC97"/>
    <text x="570" y="152">3 MATCH</text>
    <text x="570" y="174" fill="#10261E" font-weight="600">task tokens</text>

    <rect x="700" y="120" width="180" height="72" rx="6" fill="#3DDC97"/>
    <text x="790" y="152">4 LOAD</text>
    <text x="790" y="174" fill="#10261E" font-weight="600">depth-1 set</text>

    <rect x="920" y="120" width="220" height="72" rx="6" fill="#E8B84A"/>
    <text x="1030" y="152">5 ACT</text>
    <text x="1030" y="174" fill="#3A2A0A" font-weight="600">with context</text>
  </g>

  <g fill="#2A3548">
    <rect x="220" y="150" width="40" height="4"/>
    <rect x="440" y="150" width="40" height="4"/>
    <rect x="660" y="150" width="40" height="4"/>
    <rect x="880" y="150" width="40" height="4"/>
  </g>

  <text x="130" y="240" class="mono" font-size="12" fill="#7F8BA3" text-anchor="middle">agents/*.md</text>
  <text x="350" y="240" class="mono" font-size="12" fill="#7F8BA3" text-anchor="middle">frontmatter</text>
  <text x="570" y="240" class="mono" font-size="12" fill="#7F8BA3" text-anchor="middle">portable matcher</text>
  <text x="790" y="240" class="mono" font-size="12" fill="#7F8BA3" text-anchor="middle">context + repo + hits</text>
  <text x="1030" y="240" class="mono" font-size="12" fill="#E8B84A" text-anchor="middle">no silent guessing</text>

  <text x="600" y="290" class="sans" font-size="15" fill="#E8E2D6" text-anchor="middle">Always-on pillars every session. Matched pillars only for the task. Gaps ask instead of invent.</text>
</svg>
