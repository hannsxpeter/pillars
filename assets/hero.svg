<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">Pillars</title>
  <desc id="d">Arcade title screen. PILLARS wordmark, tagline Your agent starts blank. Give it a briefing., and npx @hxp-tools/pillars. Three stone pillars rise on the right while a ghost labeled The Guess loses HP.</desc>
  <style>
    .sans{font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .display{font-family:Newsreader,Georgia,"Times New Roman",serif}
  </style>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1C2433" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="#0E1218"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="10" fill="none" stroke="#2A3548"/>

  <path d="M1 44H1199V11a10 10 0 0 0-10-10H11A10 10 0 0 0 1 11Z" fill="#151B24"/>
  <line x1="1" y1="44" x2="1199" y2="44" stroke="#2A3548"/>
  <text x="32" y="28" class="mono" font-size="13" font-weight="700" fill="#E8B84A" letter-spacing="1.5">1UP</text>
  <text x="78" y="28" class="mono" font-size="13" font-weight="700" fill="#E8E2D6" letter-spacing="1.5">AGENT</text>
  <text x="600" y="28" class="mono" font-size="13" font-weight="700" fill="#3DDC97" text-anchor="middle" letter-spacing="1.5">HI-SCORE: BRIEFED</text>
  <text x="1168" y="28" class="mono" font-size="13" fill="#7F8BA3" text-anchor="end" letter-spacing="1.5">CREDIT 01</text>

  <text x="56" y="118" class="mono" font-size="14" font-weight="700" fill="#E8B84A" letter-spacing="4">OPEN STANDARD / AGENTS.MD</text>
  <text x="56" y="198" class="display" font-size="92" font-weight="600" fill="#F4EFE4">PILLARS</text>
  <text x="56" y="246" class="sans" font-size="22" font-weight="600" fill="#E8E2D6">Your agent starts blank.</text>
  <text x="56" y="278" class="sans" font-size="22" font-weight="600" fill="#A8B0C0">Give it a briefing.</text>

  <text x="56" y="322" class="mono" font-size="12" font-weight="700" fill="#E8B84A" letter-spacing="2">PRESS START</text>
  <rect x="56" y="334" width="430" height="44" fill="#10261E" stroke="#3DDC97" stroke-width="2"/>
  <text x="74" y="362" class="mono" font-size="18" font-weight="700" fill="#3DDC97">&gt; npx @hxp-tools/pillars</text>
  <rect x="448" y="347" width="11" height="19" fill="#3DDC97">
    <animate attributeName="opacity" values="1;0" dur="1s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="56" y="404" class="mono" font-size="12" fill="#7F8BA3" letter-spacing="1.5">NO ACCOUNT / NO LOCK-IN / PLAIN MARKDOWN / ANY CODING AGENT</text>

  <!-- Three stone pillars -->
  <g transform="translate(620 90)">
    <rect x="20" y="40" width="54" height="210" fill="#8B7E68"/>
    <rect x="14" y="30" width="66" height="18" fill="#C4B59A"/>
    <rect x="26" y="250" width="42" height="14" fill="#C4B59A"/>
    <text x="47" y="150" class="mono" font-size="11" font-weight="700" fill="#0E1218" text-anchor="middle">CTX</text>

    <rect x="110" y="70" width="54" height="180" fill="#9A8C74"/>
    <rect x="104" y="60" width="66" height="18" fill="#D2C4A8"/>
    <rect x="116" y="250" width="42" height="14" fill="#D2C4A8"/>
    <text x="137" y="165" class="mono" font-size="11" font-weight="700" fill="#0E1218" text-anchor="middle">REPO</text>

    <rect x="200" y="100" width="54" height="150" fill="#7E7260"/>
    <rect x="194" y="90" width="66" height="18" fill="#B8A98E"/>
    <rect x="206" y="250" width="42" height="14" fill="#B8A98E"/>
    <text x="227" y="180" class="mono" font-size="11" font-weight="700" fill="#0E1218" text-anchor="middle">DATA</text>

    <rect x="8" y="264" width="260" height="10" fill="#2A3548"/>
  </g>

  <!-- The Guess ghost -->
  <g transform="translate(940 70)">
    <text x="90" y="24" class="mono" font-size="12" font-weight="700" fill="#E8E2D6" text-anchor="middle" letter-spacing="1.5">THE GUESS</text>
    <text x="24" y="48" class="mono" font-size="12" font-weight="700" fill="#E8B84A">HP</text>
    <rect x="48" y="36" width="120" height="14" fill="#2A1518" stroke="#6B3038"/>
    <rect x="50" y="38" width="28" height="10" fill="#FF5C6C"/>
    <path fill="#6B7A94" d="M50 70h80v70H50z"/>
    <path fill="#8B97AE" d="M40 80h100v50H40z"/>
    <circle cx="70" cy="100" r="8" fill="#0E1218"/>
    <circle cx="110" cy="100" r="8" fill="#0E1218"/>
    <path fill="#0E1218" d="M68 120h44v6H68z"/>
    <path fill="#6B7A94" d="M50 140h16v16H50zm24 0h16v16H74zm24 0h16v16H98zm24 0h16v16h-16z"/>
    <text x="90" y="188" class="mono" font-size="12" font-weight="700" fill="#FF5C6C" text-anchor="middle">CRITICAL HIT!</text>
    <text x="90" y="210" class="mono" font-size="11" fill="#3DDC97" text-anchor="middle">BRIEFING LOADED</text>
  </g>
</svg>
